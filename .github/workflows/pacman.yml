name: Atualizar calendario Pac-Man
'on':
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacman.yml'
permissions:
  contents: read
concurrency:
  group: pacman-calendar
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Gerar animacoes com as contribuicoes reais
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ArthurBD07
          games: pacman
          hide_month_labels: 'false'
      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
