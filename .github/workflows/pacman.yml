name: Atualizar calendario Pac-Man
'on':
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacman.yml'
permissions:
  contents: read
concurrency:
  group: pacman-calendar
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Gerar animacoes com as contribuicoes reais
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ArthurBD07
          games: pacman
          hide_month_labels: 'false'
      - name: Manter os dias de contribuicao visiveis
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in Path('dist').glob('pacman-contribution-graph*.svg'):
              svg = path.read_text()
              def preserve_day(match):
                  cell = match.group(0)
                  initial = re.search(r'values="(#[a-fA-F0-9]{6})', cell)
                  if not initial:
                      return cell
                  color = initial.group(1)
                  if path.name.endswith('-dark.svg'):
                      color = {'#0e4429': '#196c2e', '#006d32': '#2ea043', '#26a641': '#3fb950', '#39d353': '#56d364'}.get(color, color)
                  cell = re.sub(r'fill="#[a-fA-F0-9]{6}"', 'fill="' + color + '"', cell, count=1)
                  return re.sub(r'<animate\b[\s\S]*?/>', '', cell)
              svg = re.sub(r'<rect id="c-\d+-\d+"[^>]*>[\s\S]*?</rect>', preserve_day, svg)
              path.write_text(svg)
      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
